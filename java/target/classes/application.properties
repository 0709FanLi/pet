# 数据库配置
spring.datasource.url=jdbc:mysql://localhost:3306/pet_recovery?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA配置
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# 服务器配置
server.port=8080

# JWT配置
jwt.secret=petRecoverySecretKey2024
jwt.expiration=86400000

# Swagger配置
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# 日志配置
logging.level.com.petrecovery=DEBUG
logging.level.org.springframework.security=DEBUG

# MQTT配置
mqtt.broker.url=tcp://localhost:1883
mqtt.client.id=pet-recovery-server
mqtt.username=
mqtt.password=
mqtt.topic.prefix=pet_recovery